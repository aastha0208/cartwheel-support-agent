# The CI workflow for Homework 6.
#
# On every push, the workflow runs unit and integration tests without model
# calls. Once CARTWHEEL_ENABLE_COMPLETE_EVALS is enabled, pull requests from
# this repository and nightly runs also run the complete
# evaluation tests five times and applies the rule saved with each test. The pull
# request job also checks whether an evaluation request was copied into the
# agent prompt or a judge example.
#
# Homework 8 adds the Module 4 adversarial tests to the offline-checks job, so
# a security regression fails the same workflow as a quality regression.

name: evals

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * *" # nightly, catches provider-side drift between PRs

jobs:
  offline-checks:
    name: unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Unit and integration tests, with no model keys
        run: uv run pytest tests/eval -k "unit or integration" -q
      - name: Homework structural checks
        run: uv run pytest tests/test_hw_holes.py -q
      - name: CLI and database lifecycle checks, with no model keys
        run: uv run pytest tests/test_cli.py tests/test_db.py -q

  complete-evaluations:
    name: complete evaluations and leakage check
    # The starter intentionally contains HW6 placeholders. Enable this job
    # after implementing them and configuring model credentials. Fork PRs
    # cannot access those credentials and must use the offline checks.
    if: >-
      vars.CARTWHEEL_ENABLE_COMPLETE_EVALS == 'true' &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      CARTWHEEL_RUN_E2E: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Require model and judge credentials
        run: |
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY is required for complete evaluations"; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY is required for complete evaluations"; exit 1; }
      - name: Evaluation case and prompt leakage check
        run: uv run python scripts/check_leakage.py
      - name: CI evaluation tests, with five runs per complete test
        run: uv run pytest tests/eval/test_e2e.py -q -s
