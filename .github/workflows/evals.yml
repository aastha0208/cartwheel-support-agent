name: evals

on:
  push:
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run checks that do not call a model
        run: uv run pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_hw_holes.py tests/test_harbor_adapter.py tests/test_replay_harness.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      # Stop before any model call when the model or a needed key is missing.
      # Only the names are printed, never the values.
      - name: Check model and provider keys
        run: |
          test -n "$CARTWHEEL_MODEL" || { echo "Set the CARTWHEEL_MODEL repository variable"; exit 1; }
          for name in ANTHROPIC_API_KEY OPENAI_API_KEY; do
            test -n "${!name}" || { echo "Add the $name repository secret"; exit 1; }
          done

      - name: Install Harbor
        run: |
          uv tool install 'harbor==0.23.0'
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Generate the classified Harbor tasks
        run: uv run python scripts/export_harbor_tasks.py

      # Every trial runs in a fresh Docker container. Harbor reads the agent
      # and judge provider keys from the job environment above.
      - name: Run the evaluation cases
        run: |
          harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes

      # Fails the job when any run of a regression case fails.
      - name: Summarize results and apply the CI gate
        if: always()
        run: uv run python scripts/summarize_harbor_job.py .harbor/jobs/hw6-evals --expected-attempts 5

      - name: Upload the Harbor job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals
          path: .harbor/jobs/hw6-evals
          include-hidden-files: true
